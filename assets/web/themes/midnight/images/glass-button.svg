<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!-- Round dark glass button, normal state. -->
    <defs>
        <radialGradient id="body" cx="50%" cy="28%" r="78%">
            <stop offset="0" stop-color="#6d747e"/>
            <stop offset="0.5" stop-color="#2a2e34"/>
            <stop offset="1" stop-color="#050607"/>
        </radialGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#a3acb7"/>
            <stop offset="1" stop-color="#16191c"/>
        </linearGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
        </linearGradient>
    </defs>
    <circle cx="16" cy="16" r="15.25" fill="url(#body)" stroke="url(#rim)" stroke-width="1.25"/>
    <ellipse cx="16" cy="9.75" rx="10.5" ry="6.25" fill="url(#gloss)"/>
</svg>
