<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
    <!-- Background of covers without an image: a light glossy surface with a faint disc. -->
    <defs>
        <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fbfcfd"/>
            <stop offset="0.55" stop-color="#e3e8ee"/>
            <stop offset="1" stop-color="#c9d1db"/>
        </linearGradient>
        <radialGradient id="disc" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="0.2" stop-color="#ffffff" stop-opacity="0.7"/>
            <stop offset="0.24" stop-color="#b9c3cf" stop-opacity="0.35"/>
            <stop offset="0.96" stop-color="#ffffff" stop-opacity="0.35"/>
            <stop offset="1" stop-color="#9aa6b4" stop-opacity="0.3"/>
        </radialGradient>
        <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
            <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.1"/>
            <stop offset="0.46" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
    </defs>
    <rect width="100" height="100" fill="url(#surface)"/>
    <circle cx="50" cy="50" r="40" fill="url(#disc)"/>
    <rect width="100" height="100" fill="url(#sheen)"/>
</svg>
