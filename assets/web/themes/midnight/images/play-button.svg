<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Large round play button: a glowing blue glass orb with a soft halo. -->
    <defs>
        <radialGradient id="halo" cx="50%" cy="50%" r="50%">
            <stop offset="0.7" stop-color="#3aa0ff" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#3aa0ff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="body" cx="50%" cy="66%" r="62%">
            <stop offset="0" stop-color="#8fdcff"/>
            <stop offset="0.45" stop-color="#1f86e8"/>
            <stop offset="1" stop-color="#062a6b"/>
        </radialGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#d4eeff"/>
            <stop offset="1" stop-color="#0a2756"/>
        </linearGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
        </linearGradient>
    </defs>
    <circle cx="32" cy="32" r="32" fill="url(#halo)"/>
    <circle cx="32" cy="32" r="25" fill="url(#body)" stroke="url(#rim)" stroke-width="1.5"/>
    <ellipse cx="32" cy="21" rx="17" ry="9.5" fill="url(#gloss)"/>
</svg>
