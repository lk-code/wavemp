<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Large round play button, hover state: brighter orb and a stronger halo. -->
    <defs>
        <radialGradient id="halo" cx="50%" cy="50%" r="50%">
            <stop offset="0.66" stop-color="#5cb8ff" stop-opacity="0.85"/>
            <stop offset="1" stop-color="#5cb8ff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="body" cx="50%" cy="66%" r="62%">
            <stop offset="0" stop-color="#c2edff"/>
            <stop offset="0.45" stop-color="#3a9ff5"/>
            <stop offset="1" stop-color="#0a3a8c"/>
        </radialGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#14408a"/>
        </linearGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
        </linearGradient>
    </defs>
    <circle cx="32" cy="32" r="32" fill="url(#halo)"/>
    <circle cx="32" cy="32" r="25" fill="url(#body)" stroke="url(#rim)" stroke-width="1.5"/>
    <ellipse cx="32" cy="21" rx="17" ry="9.5" fill="url(#gloss)"/>
</svg>
