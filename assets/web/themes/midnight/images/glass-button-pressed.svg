<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!-- Round dark glass button, pressed state: darker, light from below. -->
    <defs>
        <radialGradient id="body" cx="50%" cy="78%" r="80%">
            <stop offset="0" stop-color="#2f76c4"/>
            <stop offset="0.5" stop-color="#11263f"/>
            <stop offset="1" stop-color="#020407"/>
        </radialGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0b1626"/>
            <stop offset="1" stop-color="#6fb6f5"/>
        </linearGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
    </defs>
    <circle cx="16" cy="16" r="15.25" fill="url(#body)" stroke="url(#rim)" stroke-width="1.25"/>
    <ellipse cx="16" cy="10.5" rx="9.5" ry="5.5" fill="url(#gloss)"/>
</svg>
