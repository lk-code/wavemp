<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!-- Round dark glass button, hover state with a blue glow inside. -->
    <defs>
        <radialGradient id="body" cx="50%" cy="70%" r="80%">
            <stop offset="0" stop-color="#3f9cf2"/>
            <stop offset="0.45" stop-color="#1c4f8a"/>
            <stop offset="1" stop-color="#050b14"/>
        </radialGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#bfe3ff"/>
            <stop offset="1" stop-color="#0f2c4d"/>
        </linearGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
        </linearGradient>
    </defs>
    <circle cx="16" cy="16" r="15.25" fill="url(#body)" stroke="url(#rim)" stroke-width="1.25"/>
    <ellipse cx="16" cy="9.75" rx="10.5" ry="6.25" fill="url(#gloss)"/>
</svg>
